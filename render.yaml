services:
  - type: web
    name: adithyan-portfolio
    runtime: static
    rootDir: artifacts/portfolio
    buildCommand: npm install && npm run build
    staticPublishPath: dist/public
    pullRequestPreviewsEnabled: false
    envVars:
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
